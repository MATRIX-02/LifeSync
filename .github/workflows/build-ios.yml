# Builds an UNSIGNED iOS .ipa for sideloading (no Mac, no paid Apple account).
#
# Trigger: Actions tab -> "Build iOS (unsigned)" -> Run workflow.
# Output:  the run's "LifeSync-ios" artifact (a zip containing LifeSync.ipa).
#
# Install it with Sideloadly or AltStore on Windows using a free Apple ID -
# they re-sign the .ipa. Free-account signatures expire after 7 days; re-sign
# (AltStore can refresh automatically). Full steps: docs/IOS_SIDELOAD.md.
#
# Uses the same EXPO_PUBLIC_SUPABASE_* secrets as release-apk.yml.

name: Build iOS (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist && zip -qry LifeSync.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LifeSync-ios
          path: dist/LifeSync.ipa
          retention-days: 14
