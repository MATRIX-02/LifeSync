# Builds a signed release APK and publishes it as a GitHub Release.
#
# Triggers:
#   - pushing a tag like v1.3.0           (git tag v1.3.0 && git push origin v1.3.0)
#   - "Run workflow" in the Actions tab   (enter the tag; it is created if missing)
#   - "Run workflow" with "Dry run" ticked: full signed build, no release -
#     the APK is attached to the run as an artifact. Use it to test CI.
#
# Release notes come from docs/releases/<tag>.md when it exists, otherwise
# GitHub generates them from the commits.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of ~/.android-keystores/lifesync-release.jks
#   ANDROID_KEYSTORE_PASSWORD   LIFESYNC_UPLOAD_STORE_PASSWORD
#   ANDROID_KEY_ALIAS           LIFESYNC_UPLOAD_KEY_ALIAS (lifesync-release)
#   ANDROID_KEY_PASSWORD        LIFESYNC_UPLOAD_KEY_PASSWORD
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   EXPO_PUBLIC_GROQ_API_KEY
#
# The build REFUSES to run without the signing secrets. Falling back to the
# debug key (what plugins/withReleaseSigning.js does locally) would produce an
# APK that cannot be installed over existing installs.

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.0). Not needed for a dry run."
        required: false
      dry_run:
        description: "Dry run: build and sign, but don't publish a release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$SB_URL" ] && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$SB_KEY" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Check version matches tag
        if: env.DRY_RUN != 'true'
        run: |
          app_version=$(node -p "require('./app.json').expo.version")
          if [ "v$app_version" != "$TAG" ]; then
            echo "::error::app.json version is $app_version but the tag is $TAG"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write app environment
        env:
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GROQ: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SB_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SB_KEY"
            echo "EXPO_PUBLIC_GROQ_API_KEY=$GROQ"
          } > .env.local

      - name: Set up release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android-keystores" "$HOME/.gradle"
          echo "$KS" | base64 --decode > "$HOME/.android-keystores/lifesync-release.jks"
          # Read by plugins/withReleaseSigning.js via gradle properties.
          {
            echo "LIFESYNC_UPLOAD_STORE_FILE=$HOME/.android-keystores/lifesync-release.jks"
            echo "LIFESYNC_UPLOAD_KEY_ALIAS=$ALIAS"
            echo "LIFESYNC_UPLOAD_STORE_PASSWORD=$KS_PASS"
            echo "LIFESYNC_UPLOAD_KEY_PASSWORD=$KEY_PASS"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          cp "$apk" "LifeSync-$TAG.apk"

      - name: Upload test APK (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LifeSync-${{ env.TAG }}-dry-run
          path: LifeSync-${{ env.TAG }}.apk
          retention-days: 7

      - name: Publish release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LifeSync ${{ env.TAG }}
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', env.TAG)) != '' && format('docs/releases/{0}.md', env.TAG) || '' }}
          generate_release_notes: ${{ hashFiles(format('docs/releases/{0}.md', env.TAG)) == '' }}
          files: LifeSync-${{ env.TAG }}.apk
          make_latest: true
